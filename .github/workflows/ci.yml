name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # The locked test dependencies (including jsdom) require a current
          # Node 24 runtime even though the published CLI engine remains >=20.11.
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/sks-npm-test.log"
      - name: Surface test failure
        if: steps.test.outcome == 'failure'
        run: |
          {
            echo '## npm test failure output'
            echo
            echo 'The last 160 lines are copied here so the failure remains inspectable when the Actions log receiver is unavailable.'
            echo
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/sks-npm-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error title=npm test failure::$line"
          done < <(tail -n 40 "$RUNNER_TEMP/sks-npm-test.log")
          exit 1
      - name: Upload test failure log
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/sks-npm-test.log
          if-no-files-found: error
