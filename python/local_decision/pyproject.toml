[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sks-local-decision"
version = "1.0.0"
description = "SKS optional local decision worker: bounded-candidate enum inference on Apple Silicon via MLX."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "huggingface_hub==1.31.0",
]

[tool.setuptools.packages.find]
include = ["sks_local_decision*"]
